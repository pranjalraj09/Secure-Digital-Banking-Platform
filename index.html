 T(5,'withdrawal',90000,'ATM withdrawal (declined)','a-2',null,'failed');
 txns.sort((a,b)=>b.date.localeCompare(a.date));

 return {users,accounts,txns,audit,loans:[],kyc:{}};};

/* ---------- BACKEND CONNECTION (added) — start ---------- */
const USE_BACKEND=false;                // frontend-only milestone work; backend integration will be added by the backend developer
const API_URL='http://localhost:8080';
let TOKEN=null,ROLE=null;
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s));
const items=p=>Array.isArray(p)?p:(p&&p.content)||[];

// one helper that talks to the backend
async function api(path,method='GET',body){
 let res;
 try{res=await fetch(API_URL+path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined})}
 catch(e){throw Error('Cannot reach the backend at '+API_URL+'. Is it running?')}
 const data=await res.json().catch(()=>null);
 if(!res.ok){
  let msg=(data&&(data.message||data.error))||'';
  if(data&&data.details)msg+=(msg?' — ':'')+Object.values(data.details).join(', ');
  if(!msg)msg=res.status===401?'Session expired. Please sign in again.':res.status===403?'You are not allowed to do this.':'Request failed ('+res.status+')';
  throw Error(msg)}
 return data}

// TEMPORARY dev login: the backend hands out a pass (token). Replace with Keycloak later.
async function getToken(username,role,customerId){
 TOKEN=null;ROLE=null;
 const q=new URLSearchParams({username,role});if(customerId)q.set('customerId',customerId);
 const d=await api('/api/auth/token?'+q.toString(),'POST');
 TOKEN=d.token;ROLE=role}

// some actions are staff-only in the backend (e.g. opening an account); borrow a teller pass, then give the user's pass back
async function asStaff(fn){const k=[TOKEN,ROLE];await getToken('teller@fincore.bank','TELLER');try{return await fn()}finally{TOKEN=k[0];ROLE=k[1]}}

// backend -> website shapes
const toAcct=(r,userId,old)=>({id:r.id,no:r.accountNumber,userId,type:r.accountType==='CHECKING'?'Current':'Savings',
 nick:(old&&old.nick)||(r.accountType==='CHECKING'?'Current Account':'Savings Account'),
 balance:Number(r.balance),status:String(r.status||'ACTIVE').toLowerCase(),opened:r.createdAt});
const toTxn=r=>{const w=String(r.transactionType).toUpperCase()==='WITHDRAWAL';const st=String(r.status).toUpperCase();
 const status=st==='COMPLETED'?'completed':(st==='FAILED'||st==='REJECTED')?'failed':'pending';
 return {id:r.id,date:r.timestamp,type:w?'withdrawal':'deposit',amount:Number(r.amount),
  desc:(r.description||(w?'Cash withdrawal':'Cash deposit'))+(status==='failed'&&r.failureReason?' — '+r.failureReason:''),
  from:w?r.accountId:null,to:w?null:r.accountId,status,note:''}};
function upsertAcct(db,a){const i=db.accounts.findIndex(x=>x.id===a.id);if(i>=0)db.accounts[i]=a;else db.accounts.push(a)}
function setTxns(db,accId,list){db.txns=db.txns.filter(t=>t.from!==accId&&t.to!==accId).concat(list);db.txns.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
// remove the original made-up accounts/transactions (their ids are not real backend ids)
function dropFake(db){const f=new Set(db.accounts.filter(a=>!isUuid(a.id)).map(a=>a.id));db.accounts=db.accounts.filter(a=>!f.has(a.id));db.txns=db.txns.filter(t=>!f.has(t.from)&&!f.has(t.to))}

// make sure this website user exists as a real customer in the backend, then switch to their own pass
async function linkBackend(u){
 if(u.role==='admin'){await getToken('admin@fincore.bank','ADMIN');return}
 await getToken('teller@fincore.bank','TELLER');
 let c=items(await api('/api/customers?size=200')).find(x=>String(x.email).toLowerCase()===u.email.toLowerCase());
 if(!c){const p=u.name.trim().split(/\s+/);
  c=await api('/api/customers','POST',{firstName:p[0],lastName:p.slice(1).join(' ')||'-',email:u.email,phoneNumber:u.phone||'0000000000'})}
 u.customerId=c.id;
 await getToken(u.email,'CUSTOMER',c.id)}

// load this customer's accounts + transactions
async function loadMine(db,u){
 for(const r of items(await api('/api/customers/'+u.customerId+'/accounts'))){
  upsertAcct(db,toAcct(r,u.id,db.accounts.find(x=>x.id===r.id)));
  setTxns(db,r.id,items(await api('/api/accounts/'+r.id+'/transactions?size=200')).map(toTxn))}}

// load everything an admin screen needs
async function refreshAdminData(db){
 const byCust={};
 for(const c of items(await api('/api/customers?size=200'))){
  let u=db.users.find(x=>x.customerId===c.id||String(x.email).toLowerCase()===String(c.email).toLowerCase());
  if(!u){u={id:'c-'+c.id,name:c.fullName||(c.firstName+' '+c.lastName),email:c.email,password:null,phone:c.phoneNumber||'',
   address:[c.addressLine1,c.city].filter(Boolean).join(', '),role:'customer',status:'active',joined:c.createdAt};db.users.push(u)}
  u.customerId=c.id;byCust[c.id]=u}
 const accs=items(await api('/api/accounts?size=200'));
 for(const r of accs){const u=byCust[r.customerId];upsertAcct(db,toAcct(r,u?u.id:null,db.accounts.find(x=>x.id===r.id)))}
 for(const r of accs.slice(0,30))setTxns(db,r.id,items(await api('/api/accounts/'+r.id+'/transactions?size=100')).map(toTxn));
 db.audit=items(await api('/api/audit-logs?size=100')).map(a=>({id:a.id,date:a.timestamp,actor:a.actor,action:a.action,detail:[a.resourceType,a.outcome].filter(Boolean).join(' · ')}))}

// the real versions of the website actions (they replace the fake ones)
function makeBackendSvc({db,commit,fake}){
 const money=async(u,id,amt,note,kind)=>{
  const a=db.accounts.find(x=>x.id===id);if(!a)throw Error('Account not found.');
  const r=await api('/api/accounts/'+id+'/transactions/'+kind,'POST',{amount:amt,description:note||(kind==='deposit'?'Cash deposit':'Cash withdrawal'),referenceId:'WEB-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)});
  a.balance=Number(r.resultingBalance);
  const t={id:r.id,date:r.timestamp,type:kind==='deposit'?'deposit':'withdrawal',amount:Number(r.amount),desc:r.description||(kind==='deposit'?'Cash deposit':'Cash withdrawal'),
   from:kind==='deposit'?null:id,to:kind==='deposit'?id:null,status:'completed',note};
  db.txns.unshift(t);commit();return t};
 return {
  async login(email,pw,portal){const u=await fake.login(email,pw,portal);   // password check is still local until Keycloak
   await linkBackend(u);dropFake(db);
   if(u.role==='admin')await refreshAdminData(db);else await loadMine(db,u);
   commit();return u},
  async register(f){const u=await fake.register(f);await linkBackend(u);dropFake(db);commit();return u},
  async openAccount(u,type,nick){
   if(db.accounts.filter(a=>a.userId===u.id).length>=5)throw Error('Maximum of 5 accounts reached.');
   const r=await asStaff(()=>api('/api/accounts','POST',{customerId:u.customerId,accountType:type==='Current'?'CHECKING':'SAVINGS',currency:'INR',initialBalance:0}));
   const a=toAcct(r,u.id,{nick:nick||type+' Account'});upsertAcct(db,a);commit();return a},
  deposit:(u,id,amt,note)=>money(u,id,amt,note,'deposit'),
  withdraw:(u,id,amt,note)=>money(u,id,amt,note,'withdraw'),
  async transfer(){throw Error('Transfer is not available yet: the backend transfer API is still being built.')},
  async setStatus(admin,kind,id,status){
   if(kind==='account'&&isUuid(id)){
    await api('/api/accounts/'+id+'/status','PATCH',{status:status==='frozen'?'FROZEN':'ACTIVE',reason:'Changed from admin console'});
    const a=db.accounts.find(x=>x.id===id);if(a)a.status=status;commit();return}
   return fake.setStatus(admin,kind,id,status)},          // customer suspend/reactivate is still local only
  async refreshAdmin(){if(ROLE!=='ADMIN')return;try{await refreshAdminData(db);commit()}catch(e){console.warn('Admin refresh failed:',e.message)}}
 }}
/* ---------- BACKEND CONNECTION (added) — end ---------- */

function buildEmiSchedule(loan){const principal=Number(loan.amount)||0,rate=(Number(loan.rate)||0)/1200,months=Number(loan.tenure)||0,emi=emiFor(principal,Number(loan.rate)||0,months);let balance=principal;const start=new Date(loan.disbursedAt||loan.createdAt||Date.now());return Array.from({length:months},(_,i)=>{const interest=balance*rate;let principalPart=Math.min(balance,emi-interest);if(i===months-1)principalPart=balance;const total=principalPart+interest;balance=Math.max(0,balance-principalPart);const due=new Date(start.getFullYear(),start.getMonth()+i+1,start.getDate());return {number:i+1,dueDate:due.toISOString(),openingBalance:balance+principalPart,principal:principalPart,interest,emi:total,closingBalance:balance}})}

const Btn=({v='pri',className,busy,children,...p})=><button {...p} disabled={p.disabled||busy} className={cx('inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed',v==='pri'&&'bg-navy-700 text-white hover:bg-navy-600 dark:bg-navy-500 dark:hover:bg-navy-600',v==='out'&&'border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800',v==='dng'&&'bg-red-600 text-white hover:bg-red-700',v==='gho'&&'hover:bg-slate-100 dark:hover:bg-slate-800',className)}>{busy&&<span className="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"/>}{children}</button>;

const acctName=(db,id)=>{const a=db.accounts.find(x=>x.id===id);return a?`${a.nick||a.type} ••${a.no.slice(-4)}`:'External'};

/* ---------- App ---------- */
function App(){
 const dbRef=useRef(seed());const [,tick]=useState(0);const db=dbRef.current;const commit=()=>tick(n=>n+1);
 const [user,setUser]=useState(null);const [page,setPage]=useState('');const [toasts,setToasts]=useState([]);
 const [dark,setDark]=useState(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 useEffect(()=>{document.documentElement.classList.toggle('dark',dark)},[dark]);
 const toast=(msg,kind='ok')=>{const id=Math.random();setToasts(t=>[...t,{id,msg,kind}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000)};
 const log=(actor,action,detail)=>db.audit.unshift({id:uid('AUD'),date:new Date().toISOString(),actor:actor.name,action,detail});
 const cur=user&&db.users.find(u=>u.id===user.id);
 const fake={
  async login(email,pw,portal){await delay(700);const u=db.users.find(u=>u.email===email.trim().toLowerCase()&&u.password===pw);if(!u)throw Error('Invalid email or password.');if(u.role!==portal)throw Error(portal==='admin'?'This account does not have admin access.':'Admins must use the Admin portal.');if(u.status!=='active')throw Error('This profile is suspended. Contact support.');log(u,'LOGIN',portal+' sign-in');commit();return u},
  async register(f){await delay(800);if(db.users.some(u=>u.email===f.email.toLowerCase()))throw Error('An account with this email already exists.');const u={id:uid('u'),name:f.name,email:f.email.toLowerCase(),password:f.password,phone:f.phone,address:'',role:'customer',status:'active',joined:new Date().toISOString()};db.users.push(u);log(u,'REGISTER','New customer registered');commit();return u},
  async openAccount(u,type,nick){await delay(700);if(db.accounts.filter(a=>a.userId===u.id).length>=5)throw Error('Maximum of 5 accounts reached.');const a={id:uid('a'),no:'FCN'+Math.floor(1e9+Math.random()*9e9)+'',userId:u.id,type,nick:nick||type+' Account',balance:0,status:'active',opened:new Date().toISOString()};db.accounts.push(a);log(u,'ACCOUNT_OPEN',`${type} ${a.no}`);commit();return a},
  async deposit(u,id,amt,note){await delay(900);const a=db.accounts.find(x=>x.id===id);if(!a||a.userId!==u.id)throw Error('Account not found.');if(a.status!=='active')throw Error('Account is not active.');if(!(amt>0))throw Error('Amount must be positive.');if(amt>500000)throw Error('Demo deposit limit is ₹5,00,000.');a.balance=+(a.balance+amt).toFixed(2);const t={id:uid('TXN'),date:new Date().toISOString(),type:'deposit',amount:amt,desc:note||'Cash deposit (simulated)',from:null,to:id,status:'completed',note};db.txns.unshift(t);log(u,'DEPOSIT',`${fmt(amt)} → ${a.no}`);commit();return t},
  async withdraw(u,id,amt,note){await delay(900);const a=db.accounts.find(x=>x.id===id);if(!a||a.userId!==u.id)throw Error('Account not found.');if(a.status!=='active')throw Error('Account is not active.');if(!(amt>0))throw Error('Amount must be positive.');if(amt>a.balance)throw Error('Insufficient balance for this withdrawal.');a.balance=+(a.balance-amt).toFixed(2);const t={id:uid('TXN'),date:new Date().toISOString(),type:'withdrawal',amount:amt,desc:note||'Cash withdrawal (simulated)',from:id,to:null,status:'completed',note};db.txns.unshift(t);log(u,'WITHDRAW',`${fmt(amt)} ← ${a.no}`);commit();return t},
  async transfer(u,fromId,toNo,amt,note){await delay(1000);const f=db.accounts.find(x=>x.id===fromId);const t=db.accounts.find(x=>x.no===toNo.trim().toUpperCase());if(!f||f.userId!==u.id)throw Error('Sender account not found.');if(!t)throw Error('Recipient account number not found.');if(t.id===f.id)throw Error('Cannot transfer to the same account.');if(f.status!=='active'||t.status!=='active')throw Error('Both accounts must be active.');if(!(amt>0))throw Error('Amount must be positive.');if(amt>f.balance)throw Error('Insufficient balance for this transfer.');f.balance=+(f.balance-amt).toFixed(2);t.balance=+(t.balance+amt).toFixed(2);const x={id:uid('TXN'),date:new Date().toISOString(),type:'transfer',amount:amt,desc:note||'Transfer',from:f.id,to:t.id,status:'completed',note};db.txns.unshift(x);log(u,'TRANSFER',`${fmt(amt)} ${f.no} → ${t.no}`);commit();return x},
  async updateProfile(u,f){await delay(600);Object.assign(db.users.find(x=>x.id===u.id),f);log(u,'PROFILE_UPDATE','Profile edited');commit()},
  async setStatus(admin,kind,id,status){await delay(400);const o=(kind==='user'?db.users:db.accounts).find(x=>x.id===id);o.status=status;log(admin,kind.toUpperCase()+'_'+status.toUpperCase(),o.name||o.no);commit()},
  async applyLoan(u,form){await delay(500);const loan={id:uid('LOAN'),userId:u.id,customerName:u.name,type:form.type,amount:Number(form.amount),tenure:Number(form.tenure),income:Number(form.income),purpose:form.purpose,rate:form.type==='Personal'?12.5:form.type==='Education'?8.5:form.type==='Home'?8.25:10.5,status:'pending',disbursementStatus:'not_disbursed',paidInstallments:[],payments:[],createdAt:new Date().toISOString()};db.loans.unshift(loan);log(u,'LOAN_APPLICATION',loan.type+' loan application '+loan.id);commit();return loan},
  async reviewLoan(admin,id,status,note){await delay(350);const loan=db.loans.find(x=>x.id===id);if(!loan)throw Error('Loan application not found.');loan.status=status;loan.reviewNote=note||'';loan.reviewedAt=new Date().toISOString();if(status==='approved')loan.disbursementStatus='awaiting_disbursement';log(admin,'LOAN_'+status.toUpperCase(),loan.id+' · '+loan.type);commit();return loan},
  async disburseLoan(admin,id){const loan=db.loans.find(x=>x.id===id);if(!loan||loan.status!=='approved')throw Error('Only approved loans can be disbursed.');if(loan.disbursementStatus==='disbursed')throw Error('Loan already disbursed.');loan.disbursementStatus='disbursed';loan.disbursedAt=new Date().toISOString();loan.outstandingPrincipal=loan.amount;log(admin,'LOAN_DISBURSED',loan.id+' · '+fmt(loan.amount));commit();return loan},
  async payLoanEmi(u,id){const loan=db.loans.find(x=>x.id===id&&x.userId===u.id);if(!loan||loan.disbursementStatus!=='disbursed')throw Error('Loan is not available for repayment.');const schedule=buildEmiSchedule(loan);const next=schedule.find(x=>!loan.paidInstallments.includes(x.number));if(!next)throw Error('All EMIs are already paid.');loan.paidInstallments.push(next.number);loan.payments=loan.payments||[];loan.payments.push({number:next.number,amount:next.emi,paidAt:new Date().toISOString(),reference:uid('EMI')});loan.outstandingPrincipal=Math.max(0,next.closingBalance);log(u,'LOAN_EMI_PAID',loan.id+' · installment '+next.number);commit();return next},
  async saveKyc(u,files){const previous=db.kyc[u.id]||{};db.kyc[u.id]={...previous,...files,applicationId:previous.applicationId||uid('KYC'),status:files.panFile&&files.addressFile&&files.otpVerified==='yes'?'submitted':(previous.status||'draft'),reviewNote:'',updatedAt:new Date().toISOString()};log(u,'KYC_DOCUMENTS_UPDATED','KYC documents submitted (demo)');commit()},
  async viewKycDoc(admin,userId,label,name){log(admin,'KYC_DOCUMENT_VIEWED',label+' · '+name+' · '+userId);commit()},
  async reviewKyc(admin,userId,status,note){const k=db.kyc[userId];if(!k)throw Error('KYC application not found.');k.status=status;k.reviewNote=note||'';k.reviewedAt=new Date().toISOString();log(admin,'KYC_'+status.toUpperCase(),userId);commit();return k}};
 const svc=USE_BACKEND?{...fake,...makeBackendSvc({db,commit,fake})}:fake;
 const go=p=>setPage(p);

function Auth({onAuth}){

  if(mode==='register'){if(!/^\d{10}$/.test(f.phone))e.phone='Enter a 10-digit phone number.';if(!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$/.test(f.password))e.password='Min 8 chars with upper, lower case and a number.';if(f.confirm!==f.password)e.confirm='Passwords do not match.'}

 const submit=async ev=>{ev.preventDefault();setSrv('');if(!validate())return;setBusy(true);try{const u=mode==='login'?await svc.login(f.email,f.password,portal):await svc.register(f);onAuth(u)}catch(x){setSrv(x.message)}setBusy(false)};

    <Field label="Email" error={err.email}><input className={inp} type="email" value={f.email} onChange={set('email')}/></Field>
    {mode==='register'&&<Field label="Phone" error={err.phone}><input className={inp} inputMode="numeric" maxLength={10} value={f.phone} onChange={set('phone')}/></Field>}
    <Field label="Password" error={err.password}><input className={inp} type="password" value={f.password} onChange={set('password')}/></Field>
    {mode==='register'&&<Field label="Confirm password" error={err.confirm}><input className={inp} type="password" value={f.confirm} onChange={set('confirm')}/></Field>}
    {srv&&<p className="rounded-lg bg-red-50 p-2 text-sm text-red-700 dark:bg-red-900/30 dark:text-red-300">{srv}</p>}
    <Btn busy={busy} className="w-full">{mode==='login'?'Sign in':'Create account'}</Btn>
   </form>
   {portal==='customer'&&<p className="mt-4 text-center text-sm text-slate-500">{mode==='login'?'New here? ':'Have an account? '}<button className="font-medium text-navy-600 underline dark:text-blue-300" onClick={()=>{setMode(mode==='login'?'register':'login');setErr({});setSrv('')}}>{mode==='login'?'Register':'Sign in'}</button></p>}

  </div></div>}

const useMine=()=>{const {db,user}=useApp();const accts=db.accounts.filter(a=>a.userId===user.id);const ids=new Set(accts.map(a=>a.id));const txns=db.txns.filter(t=>ids.has(t.from)||ids.has(t.to));return {accts,ids,txns}};
const TxItem=({t,ids,onClick})=>{const {db}=useApp();const s=signed(t,ids);return <button onClick={onClick} className="flex w-full items-center justify-between gap-3 border-b border-slate-100 py-3 text-left last:border-0 dark:border-slate-800"><div className="flex items-center gap-3"><span className={cx('grid h-9 w-9 place-items-center rounded-full',s>=0?'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40':'bg-red-100 text-red-700 dark:bg-red-900/40')}><Ic n={s>=0?'down':'up'}/></span><div><div className="text-sm font-medium">{t.desc}</div><div className="text-xs text-slate-500">{dt(t.date)} · {acctName(db,ids.has(t.from)?t.from:t.to)}</div></div></div><div className="text-right"><div className={cx('text-sm font-semibold',t.status==='failed'?'text-slate-400 line-through':s>=0?'text-emerald-600':'text-red-600')}>{s>=0?'+':'−'}{fmt(Math.abs(s||t.amount))}</div><Badge s={t.status}/></div></button>};

/* ---------- Dashboard ---------- */
function Dashboard(){
 const {go,user}=useApp();const {accts,ids,txns}=useMine();const [sel,setSel]=useState(null);
 const total=accts.reduce((s,a)=>s+a.balance,0);const ok=txns.filter(t=>t.status==='completed');
 const now=new Date();const key=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()};
 const months=[...Array(6)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return {k:d.getFullYear()+'-'+d.getMonth(),m:d.toLocaleString('en',{month:'short'}),Income:0,Expenses:0}});
 ok.forEach(t=>{const r=months.find(m=>m.k===key(t.date));if(!r)return;const s=signed(t,ids);if(s>0)r.Income+=s;else r.Expenses-=s});
 const cur=months[5];
 return <><Title t={`Hello, ${user.name.split(' ')[0]}`} sub="Here's your financial overview"/>
  <div className="grid gap-4 sm:grid-cols-3">
   <Card className="bg-gradient-to-br from-navy-700 to-navy-900 text-white sm:col-span-1"><div className="text-sm text-blue-200">Total balance</div><div className="mt-1 text-3xl font-bold">{fmt(total)}</div><div className="mt-2 text-xs text-blue-200">{accts.length} account(s)</div></Card>
   <Card><div className="text-sm text-slate-500">Income this month</div><div className="mt-1 text-2xl font-semibold text-emerald-600">{fmt(cur.Income)}</div></Card>

/* ---------- Deposit / Withdraw ---------- */
function Money(){
 const {user,svc,toast}=useApp();const {accts}=useMine();const [mode,setMode]=useState('deposit');const [acct,setAcct]=useState(accts[0]?.id||'');const [amt,setAmt]=useState('');const [note,setNote]=useState('');const [err,setErr]=useState('');
 const [confirm,setConfirm]=useState(false);const [busy,setBusy]=useState(false);const [res,setRes]=useState(null);
 const a=accts.find(x=>x.id===acct);const n=parseFloat(amt);
 const check=()=>{let e='';if(!a)e='Select an account.';else if(a.status!=='active')e='This account is not active.';else if(!amt||isNaN(n)||n<=0)e='Enter an amount greater than zero.';else if(!/^\d+(\.\d{1,2})?$/.test(amt))e='Use at most 2 decimal places.';else if(mode==='deposit'&&n>500000)e='Demo deposit limit is ₹5,00,000.';else if(mode==='withdraw'&&n>a.balance)e='Insufficient balance. Available: '+fmt(a.balance);setErr(e);if(!e)setConfirm(true)};
 const run=async()=>{setBusy(true);try{const t=await svc[mode](user,acct,n,note.trim());setRes({ok:true,t});setAmt('');setNote('');toast(mode==='deposit'?'Deposit successful':'Withdrawal successful')}catch(e){setRes({ok:false,msg:e.message});toast(e.message,'err')}setBusy(false);setConfirm(false)};
 return <><Title t="Deposit & Withdraw" sub="Manage deposits and withdrawals"/>
  <Card className="max-w-lg"><div className="mb-4 grid grid-cols-2 rounded-lg bg-slate-100 p-1 text-sm dark:bg-navy-950">{[['deposit','Deposit'],['withdraw','Withdraw']].map(([k,l])=><button key={k} onClick={()=>{setMode(k);setErr('')}} className={cx('rounded-md py-1.5',mode===k&&'bg-white font-medium shadow dark:bg-navy-700')}>{l}</button>)}</div>

 return {out,props:{q,setQ,from,setFrom,to,setTo,st,setSt,ty,setTy}}};

/* ---------- Statements ---------- */
function Statements() {
  const { toast } = useApp();
  const { accts, txns } = useMine();

  const [acct, setAcct] = useState('all');
  const [from, setFrom] = useState(
    new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10)
  );
  const [to, setTo] = useState(
    new Date().toISOString().slice(0, 10)
  );

  const err = from > to
    ? 'Start date must be before end date.'
    : '';

  const rows = err
    ? []
    : txns
        .filter(
          t =>
            t.status === 'completed' &&
            t.date.slice(0, 10) >= from &&
            t.date.slice(0, 10) <= to &&
            (acct === 'all' || t.from === acct || t.to === acct)
        )
        .sort((a, b) => a.date.localeCompare(b.date));

  const sgn = t =>
    acct === 'all'
      ? signed(t, new Set(accts.map(a => a.id)))
      : signed(t, new Set([acct]));

  // Download statement as PDF
const download = () => {
  if (err) {
    toast(err, 'err');
    return;
  }

  if (!rows.length) {
    toast('No transactions available to export.', 'err');
    return;
  }

  // Initialize PDF in landscape format
  const jsPDF = window.jspdf?.jsPDF;

if (!jsPDF) {
  console.error("jsPDF failed to load:", window.jspdf);
  toast("PDF library not loaded. Check your internet connection and refresh.", "err");
  return;
}

const doc = new jsPDF('landscape', 'mm', 'a4');

  const pageWidth = doc.internal.pageSize.getWidth();

  // Calculate statement totals
  let totalCredit = 0;
  let totalDebit = 0;

  rows.forEach(t => {
    const s = sgn(t);

    if (s > 0) totalCredit += s;
    if (s < 0) totalDebit += Math.abs(s);
  });

  // PDF Header
  const drawHeader = () => {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('FINCORE NEXUS', 14, 18);

    doc.setFontSize(13);
    doc.text('BANK ACCOUNT STATEMENT', 14, 27);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);

    doc.text(`Statement Period: ${from} to ${to}`, 14, 36);

    const accountName =
      acct === 'all'
        ? 'All Accounts'
        : accts.find(a => a.id === acct)?.nick || 'Selected Account';

    doc.text(`Account: ${accountName}`, 14, 43);

    doc.setFont('helvetica', 'bold');
    doc.text(`Total Credit: INR ${totalCredit.toFixed(2)}`, 180, 36);
    doc.text(`Total Debit: INR ${totalDebit.toFixed(2)}`, 180, 43);

    doc.line(14, 49, pageWidth - 14, 49);

    // Table headings
    doc.setFontSize(9);

    doc.text('Date', 14, 57);
    doc.text('Reference', 48, 57);
    doc.text('Type', 100, 57);
    doc.text('Description', 130, 57);
    doc.text('Credit (INR)', 220, 57);
    doc.text('Debit (INR)', 260, 57);

    doc.line(14, 60, pageWidth - 14, 60);
  };

  drawHeader();

  let y = 68;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);

  rows.forEach(t => {
    const s = sgn(t);

    const description = doc.splitTextToSize(
      String(t.desc || '-'),
      80
    );

    const rowHeight = Math.max(7, description.length * 4);

    // Add another page if required
    if (y + rowHeight > 190) {
      doc.addPage();
      drawHeader();

      y = 68;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
    }

    doc.text(dt(t.date), 14, y);
    doc.text(String(t.id).slice(0, 22), 48, y);
    doc.text(String(t.type).toUpperCase(), 100, y);

    doc.text(description, 130, y);

    if (s > 0) {
      doc.text(s.toFixed(2), 220, y);
    }

    if (s < 0) {
      doc.text(Math.abs(s).toFixed(2), 260, y);
    }

    y += rowHeight + 3;

    doc.setDrawColor(220, 220, 220);
    doc.line(14, y - 1, pageWidth - 14, y - 1);
  });

  // Footer on every page
  const pageCount = doc.internal.getNumberOfPages();

  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);

    doc.setFontSize(8);
    doc.setFont('helvetica', 'italic');

    doc.text(
      'FINCORE Nexus - Computer generated statement.',
      14,
      202
    );

    doc.text(
      `Page ${i} of ${pageCount}`,
      pageWidth - 35,
      202
    );
  }

  // Download PDF
  // Generate PDF as a downloadable Blob
const pdfBlob = doc.output('blob');

const pdfUrl = URL.createObjectURL(pdfBlob);

const link = document.createElement('a');
link.href = pdfUrl;
link.download = `FINCORE-Statement-${from}-to-${to}.pdf`;

document.body.appendChild(link);
link.click();
document.body.removeChild(link);

// Release temporary URL
setTimeout(() => {
  URL.revokeObjectURL(pdfUrl);
}, 1000);

toast('PDF statement downloaded successfully!');
};

  // Statements page UI
  return (
    <>
      <Title
        t="Statements"
        sub="Select a date range and download your bank statement as PDF"
      />

      <Card>
        <div className="grid gap-3 sm:grid-cols-4">

          <Field label="Account">
            <select
              className={inp}
              value={acct}
              onChange={e => setAcct(e.target.value)}
            >
              <option value="all">All accounts</option>

              {accts.map(a => (
                <option key={a.id} value={a.id}>
                  {a.nick} ••{a.no.slice(-4)}
                </option>
              ))}
            </select>
          </Field>

          <Field label="From" error={err}>
            <input
              type="date"
              className={inp}
              value={from}
              onChange={e => setFrom(e.target.value)}
            />
          </Field>

          <Field label="To">
            <input
              type="date"
              className={inp}
              value={to}
              onChange={e => setTo(e.target.value)}
            />
          </Field>

          <div className="flex items-end">
            <Btn
  className="w-full"
  disabled={!!err}
  onClick={download}
>
  <Ic n="dl" />
  Download PDF
</Btn>
          </div>

        </div>

        <div className="mt-4">
          <Table
            cols={[
              'Date',
              'Reference',
              'Description',
              'Credit',
              'Debit'
            ]}
            empty="No completed transactions in this range."
            rows={rows.map(t => {
              const s = sgn(t);

              return [
                dt(t.date),
                t.id,
                t.desc,
                s > 0 ? fmt(s) : '',
                s < 0 ? fmt(-s) : ''
              ];
            })}
          />
        </div>
      </Card>
    </>
  );
}

function CustomerPayments(){
 const {user,toast}=useApp();const [method,setMethod]=useState('UPI');const [benef,setBenef]=useState('');const [amount,setAmount]=useState('');const [note,setNote]=useState('');const [confirm,setConfirm]=useState(false);const [busy,setBusy]=useState(false);const [result,setResult]=useState(null);
 const [showAdd,setShowAdd]=useState(false);const [bform,setBform]=useState({name:'',account:'',bank:'',method:'UPI'});const [receipt,setReceipt]=useState(null);
 const mine=demoBeneficiaries.filter(x=>x.userId===user.id);const history=demoPayments.filter(x=>x.userId===user.id);
 const selected=mine.find(x=>x.id===benef);
 const submit=()=>{if(!selected){toast('Select a beneficiary.','err');return}if(!Number.isFinite(+amount)||+amount<=0){toast('Enter a valid amount.','err');return}if(+amount>500000){toast('Demo limit is ₹5,00,000.','err');return}setConfirm(true)};
 const pay=async()=>{setBusy(true);await delay(500);const risk=Math.min(99,Math.round((+amount>50000?45:8)+(selected.verified?0:25)+Math.random()*15));const p={id:'PAY-'+Date.now(),userId:user.id,method,beneficiary:selected.name,account:selected.account,amount:+amount,status:risk>=70?'flagged':'completed',risk,date:new Date().toISOString(),settlement:risk>=70?'on_hold':'settled',saga:['Debit','Credit','Notify']};demoPayments.unshift(p);setBusy(false);setConfirm(false);setResult(p);setAmount('');setNote('');toast(p.status==='flagged'?'Payment flagged for risk review.':'Payment completed successfully.');};
 const addBenef=()=>{if(!bform.name.trim()||!bform.account.trim()){toast('Enter beneficiary name and account / UPI ID.','err');return}demoBeneficiaries.push({id:'BEN-'+Date.now(),userId:user.id,...bform,verified:false});setBform({name:'',account:'',bank:'',method:'UPI'});setShowAdd(false);toast('Beneficiary added (unverified demo).')};
 const download=p=>{
  const jsPDF=window.jspdf?.jsPDF;
  if(!jsPDF){toast('PDF library is unavailable. Check your internet connection and refresh.','err');return;}
  const doc=new jsPDF('portrait','mm','a4');
  const pageWidth=doc.internal.pageSize.getWidth();
  doc.setFillColor(15,39,78);doc.rect(0,0,pageWidth,43,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(19);
  doc.text('FINCORE NEXUS',15,19);
  doc.setFontSize(11);doc.text('PAYMENT RECEIPT',15,29);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('DIGITAL BANKING PLATFORM',15,36);
  doc.setTextColor(30,41,59);doc.setFontSize(10);
  const details=[
   ['Transaction reference',p.id],['Payment method',p.method],['Beneficiary',p.beneficiary],
   ['Account / UPI ID',p.account],['Amount','INR '+Number(p.amount).toFixed(2)],
   ['Status',String(p.status).toUpperCase()],['Risk score',String(p.risk)+'/100'],['Date and time',dt(p.date)]
  ];
  let y=61;
  details.forEach(([label,value])=>{
   doc.setFont('helvetica','bold');doc.setTextColor(100,116,139);doc.text(label,15,y);
   doc.setFont('helvetica','normal');doc.setTextColor(15,23,42);
   const lines=doc.splitTextToSize(String(value||'-'),pageWidth-75);
   doc.text(lines,75,y);y+=Math.max(12,lines.length*5+5);
   doc.setDrawColor(226,232,240);doc.line(15,y-5,pageWidth-15,y-5);
  });
  y+=8;doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');doc.setFontSize(8);
  doc.text('FINCORE Nexus | Payment Receipt',15,285);
  doc.save(`${p.id}-receipt.pdf`);
  toast('PDF payment receipt downloaded successfully!');
 };
 return <><Title t="Payments & Transfers" sub="IMPS, NEFT and UPI payments."/>
 
 <div className="grid gap-4 lg:grid-cols-5"><Card className="lg:col-span-3"><h2 className="font-semibold">Make a payment</h2><div className="mt-3 grid grid-cols-3 gap-2">{['IMPS','NEFT','UPI'].map(m=><button key={m} onClick={()=>setMethod(m)} className={cx('rounded-lg border p-3 text-sm font-semibold',method===m?'border-blue-600 bg-blue-50 text-blue-700 dark:bg-blue-900/30':'border-slate-200 dark:border-slate-700')}>{m}</button>)}</div>
 <div className="mt-4 space-y-3"><Field label="Payment method"><div className="text-sm text-slate-500">{method==='IMPS'?'Immediate demo transfer':method==='NEFT'?'Batch settlement simulation':'UPI ID / address simulation'}</div></Field>
 <Field label="Beneficiary"><select className={inp} value={benef} onChange={e=>setBenef(e.target.value)}><option value="">Select beneficiary</option>{mine.map(b=><option key={b.id} value={b.id}>{b.name} — {b.account} {b.verified?'✓ verified':'· pending verification'}</option>)}</select></Field>
 {selected&&<div className="text-xs text-slate-500">{selected.bank} · <Badge s={selected.verified?'verified':'pending verification'}/></div>}
 <Field label="Amount (₹)"><input className={inp} type="number" min="1" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="Enter amount"/></Field>
 <Field label="Payment note (optional)"><input className={inp} value={note} onChange={e=>setNote(e.target.value)} maxLength="80" placeholder="Purpose of payment"/></Field>
 <Btn className="w-full" onClick={submit}>Review payment</Btn></div></Card>
 <Card><div className="flex items-center justify-between"><h2 className="font-semibold">Beneficiaries</h2><Btn className="!px-2 !py-1 !text-xs" onClick={()=>setShowAdd(true)}>+ Add</Btn></div><div className="mt-3 space-y-3">{mine.map(b=><div key={b.id} className="rounded-lg border p-3 text-sm dark:border-slate-700"><div className="font-medium">{b.name}</div><div className="break-all text-xs text-slate-500">{b.account}</div><div className="mt-1 flex items-center justify-between"><Badge s={b.verified?'verified':'pending'}/><div className="flex gap-2"><button className="text-xs text-blue-600" onClick={()=>{const name=prompt('Beneficiary name',b.name);if(name===null)return;const account=prompt('Account number / UPI ID',b.account);if(account===null)return;b.name=name.trim()||b.name;b.account=account.trim()||b.account;b.verified=false;toast('Beneficiary updated; verification reset to pending.')}}>Edit</button><button className="text-xs text-red-600" onClick={()=>{demoBeneficiaries=demoBeneficiaries.filter(x=>x.id!==b.id);toast('Beneficiary removed.')}}>Delete</button></div></div></div>)}{!mine.length&&<p className="text-sm text-slate-500">No beneficiaries added.</p>}</div></Card></div>
 <div className="mt-4"><Card><h2 className="mb-3 font-semibold">Payment history</h2><Table cols={['Reference','Date','Method','Beneficiary','Amount','Risk','Status','Receipt']} rows={history.map(p=>[p.id,dt(p.date),p.method,p.beneficiary,fmt(p.amount),p.risk+'%',<Badge s={p.status}/>,<Btn v="out" className="!px-2 !py-1 !text-xs" onClick={()=>download(p)}>Receipt</Btn>])}/></Card></div>
 {confirm&&<Modal title="Confirm payment" onClose={()=>!busy&&setConfirm(false)}><p className="text-sm">Send <b>{fmt(+amount)}</b> via <b>{method}</b> to <b>{selected?.name}</b>?</p><div className="mt-4 flex gap-2"><Btn v="out" className="flex-1" onClick={()=>setConfirm(false)}>Cancel</Btn><Btn busy={busy} className="flex-1" onClick={pay}>Confirm payment</Btn></div></Modal>}
 {showAdd&&<Modal title="Add beneficiary" onClose={()=>setShowAdd(false)}><div className="space-y-3"><Field label="Beneficiary name"><input className={inp} value={bform.name} onChange={e=>setBform({...bform,name:e.target.value})}/></Field><Field label="Account number / UPI ID"><input className={inp} value={bform.account} onChange={e=>setBform({...bform,account:e.target.value})}/></Field><Field label="Bank"><input className={inp} value={bform.bank} onChange={e=>setBform({...bform,bank:e.target.value})}/></Field><Field label="Preferred method"><select className={inp} value={bform.method} onChange={e=>setBform({...bform,method:e.target.value})}><option>UPI</option><option>IMPS</option><option>NEFT</option></select></Field><Btn className="w-full" onClick={addBenef}>Save beneficiary</Btn></div></Modal>}
 {result&&<Modal title="Payment result" onClose={()=>setResult(null)}><div className="space-y-2 text-sm"><div className="text-lg font-semibold">{result.status==='flagged'?'Payment held for review':'Payment completed'}</div><p>Reference: <b>{result.id}</b></p><p>Amount: <b>{fmt(result.amount)}</b></p><p>Status: <Badge s={result.status}/></p><p>Risk score: {result.risk}/100</p><div className="rounded-lg bg-slate-50 p-3 dark:bg-navy-950"><b className="text-xs">Saga workflow</b><div className="mt-2 flex items-center gap-2 text-xs">{['Debit','Credit','Notify'].map((s,i)=><React.Fragment key={s}><span className="rounded bg-emerald-100 px-2 py-1 text-emerald-800">{s} ✓</span>{i<2&&<span>→</span>}</React.Fragment>)}</div></div><Btn className="w-full" onClick={()=>download(result)}>Download receipt</Btn></div></Modal>}</>;
}

function KYC(){const {user,db,svc,toast}=useApp();const saved=db.kyc[user.id]||{};const [files,setFiles]=useState({});const [mobile,setMobile]=useState(user.phone||'');const [otp,setOtp]=useState('');const [sent,setSent]=useState(false);const [verified,setVerified]=useState(false);const [busy,setBusy]=useState(false);const choose=(key)=>e=>{const f=e.target.files?.[0];if(f)setFiles(v=>({...v,[key]:f.name,[key.replace('File','Doc')]:f}))};const submit=async()=>{if(!(files.panFile||saved.panFile)||!(files.addressFile||saved.addressFile)){toast('Select both identity and address proof documents.','err');return}if(!verified&&saved.otpVerified!=='yes'){toast('Verify the demo mobile OTP before submitting.','err');return}setBusy(true);await svc.saveKyc(user,{...files,mobile,otpVerified:'yes',status:'submitted'});setBusy(false);toast('KYC application submitted for admin review.');};const status=saved.status||'not_submitted';return <><Title t="KYC Verification" sub="Submit identity and address proof and track the review decision."/><div className="grid gap-4 lg:grid-cols-2"><Card><h2 className="mb-3 font-semibold">Identity documents</h2><div className="space-y-3"><Field label="PAN card (sample file)"><input className={inp} type="file" accept="image/*,.pdf" onChange={choose('panFile')}/><small className="text-slate-500">{files.panFile||saved.panFile||'No file selected'}</small></Field><Field label="Address proof (sample file)"><input className={inp} type="file" accept="image/*,.pdf" onChange={choose('addressFile')}/><small className="text-slate-500">{files.addressFile||saved.addressFile||'No file selected'}</small></Field><Field label="Registered mobile number"><input className={inp} maxLength="10" value={mobile} onChange={e=>setMobile(e.target.value)}/></Field><div className="flex gap-2"><Btn v="out" onClick={()=>{setSent(true);setVerified(false);toast('Demo OTP sent: use 123456.')}}>Send demo OTP</Btn>{sent&&<span className="self-center text-xs text-emerald-600">OTP sent (demo)</span>}</div>{sent&&<div className="flex gap-2"><input className={inp} maxLength="6" placeholder="Enter 123456" value={otp} onChange={e=>setOtp(e.target.value)}/><Btn v="out" onClick={()=>{setVerified(otp==='123456');toast(otp==='123456'?'Mobile verified (demo).':'Invalid demo OTP.',otp==='123456'?'ok':'err')}}>Verify</Btn></div>}<div className="text-xs">Mobile verification: <Badge s={verified||saved.otpVerified==='yes'?'verified':'pending'}/></div><Btn busy={busy} onClick={submit}>Submit KYC for review</Btn></div></Card><Card><h2 className="font-semibold">Verification status</h2><div className="mt-3 flex items-center justify-between border-b py-3 dark:border-slate-700"><span className="text-sm">Overall KYC</span><Badge s={status}/></div><div className="space-y-3 py-3 text-sm"><p>✓ Profile information</p><p>{saved.panFile||files.panFile?'✓':'○'} PAN document selected</p><p>{saved.addressFile||files.addressFile?'✓':'○'} Address document selected</p><p>{saved.otpVerified==='yes'||verified?'✓':'○'} Mobile OTP verification</p></div>{saved.reviewNote&&<div className="rounded-lg bg-amber-50 p-3 text-sm text-amber-800 dark:bg-amber-900/20 dark:text-amber-200">Admin review note: {saved.reviewNote}</div>}{status==='rejected'&&<p className="mt-2 text-xs text-red-600">Your application was rejected. Update your documents and resubmit.</p>}</Card></div></>}
function KycDocViewer({doc}){

  :<p className="py-16 text-center text-sm text-slate-500">Preview is not available for this file type. Ask the customer to upload an image or PDF.</p>}
 </div></div>}
function AKYC(){const {db,user,svc,toast}=useApp();const [notes,setNotes]=useState({});const [viewing,setViewing]=useState(null);const openDoc=(userId,u,label,doc)=>{setViewing({title:label+' — '+u.name,doc});svc.viewKycDoc(user,userId,label,doc.name)};const entries=Object.entries(db.kyc).map(([userId,k])=>({userId,k,u:db.users.find(x=>x.id===userId)})).filter(x=>x.u);const pending=entries.filter(x=>x.k.status==='submitted'||x.k.status==='under_review');const act=async(id,status)=>{try{await svc.reviewKyc(user,id,status,notes[id]);toast('KYC '+status+' (demo).')}catch(e){toast(e.message,'err')}};return <><Title t="KYC Verification Dashboard" sub={`${entries.length} application(s) · ${pending.length} awaiting review`}/><div className="mb-4 grid gap-3 sm:grid-cols-3"><Stat l="Total applications" v={entries.length}/><Stat l="Awaiting review" v={pending.length}/><Stat l="Approved" v={entries.filter(x=>x.k.status==='approved').length}/></div><div className="space-y-4">{entries.length?entries.map(({userId,k,u})=><Card key={userId}><div className="flex flex-wrap items-start justify-between gap-2"><div><h2 className="font-semibold">{u.name}</h2><p className="text-xs text-slate-500">{u.email} · {u.phone} · {k.applicationId||'KYC-'+userId}</p></div><Badge s={k.status||'draft'}/></div><div className="mt-4 grid gap-3 sm:grid-cols-2"><div className="rounded-lg bg-slate-50 p-3 text-sm dark:bg-navy-950"><div className="text-xs text-slate-500">PAN document</div><div className="flex items-center justify-between gap-2"><b className="break-all">{k.panFile||'Not provided'}</b>{k.panDoc?<Btn v="out" className="!px-2 !py-1 !text-xs" onClick={()=>openDoc(userId,u,'PAN document',k.panDoc)}>View</Btn>:k.panFile?<span className="text-xs text-slate-500">File not available</span>:null}</div></div><div className="rounded-lg bg-slate-50 p-3 text-sm dark:bg-navy-950"><div className="text-xs text-slate-500">Address proof</div><div className="flex items-center justify-between gap-2"><b className="break-all">{k.addressFile||'Not provided'}</b>{k.addressDoc?<Btn v="out" className="!px-2 !py-1 !text-xs" onClick={()=>openDoc(userId,u,'Address proof',k.addressDoc)}>View</Btn>:k.addressFile?<span className="text-xs text-slate-500">File not available</span>:null}</div></div><div className="text-sm"><span className="text-slate-500">Mobile:</span> {k.mobile||'—'} · <Badge s={k.otpVerified==='yes'?'verified':'pending'}/></div><div className="text-xs text-slate-500">Submitted / updated: {k.updatedAt?dt(k.updatedAt):'—'}</div></div>{(k.status==='submitted'||k.status==='under_review')&&<div className="mt-3 space-y-2"><Field label="Review note / rejection reason"><input className={inp} value={notes[userId]||''} onChange={e=>setNotes(v=>({...v,[userId]:e.target.value}))} placeholder="Enter note; required when rejecting"/></Field><div className="flex gap-2"><Btn onClick={()=>act(userId,'approved')}>Approve KYC</Btn><Btn v="dng" onClick={()=>{if(!notes[userId]?.trim()){toast('Enter a rejection reason first.','err');return}act(userId,'rejected')}}>Reject KYC</Btn></div></div>}{k.reviewNote&&<p className="mt-3 text-sm text-slate-500">Previous review note: {k.reviewNote}</p>}</Card>):<Card><p className="py-8 text-center text-sm text-slate-500">No KYC applications submitted yet. Customer submissions will appear here.</p></Card>}</div>{viewing&&<Modal wide title={viewing.title} onClose={()=>setViewing(null)}><KycDocViewer doc={viewing.doc}/></Modal>}</>}

/* ---------- Profile ---------- */
function Profile(){
 const {user,svc,toast}=useApp();const [edit,setEdit]=useState(false);const [f,setF]=useState({name:user.name,phone:user.phone,address:user.address});const [err,setErr]=useState({});const [busy,setBusy]=useState(false);
 const save=async()=>{const e={};if(f.name.trim().length<2)e.name='Enter your full name.';if(!/^\d{10}$/.test(f.phone))e.phone='Enter a 10-digit phone number.';setErr(e);if(Object.keys(e).length)return;setBusy(true);await svc.updateProfile(user,{name:f.name.trim(),phone:f.phone,address:f.address.trim()});setBusy(false);setEdit(false);toast('Profile updated')};
 return <><Title t="Profile"/><Card className="max-w-lg">{edit?<div className="space-y-3"><Field label="Full name" error={err.name}><input className={inp} value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></Field><Field label="Phone" error={err.phone}><input className={inp} maxLength={10} value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/></Field><Field label="Address"><input className={inp} value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></Field><div className="flex gap-2"><Btn v="out" onClick={()=>{setEdit(false);setErr({})}}>Cancel</Btn><Btn busy={busy} onClick={save}>Save changes</Btn></div></div>
  :<><dl className="space-y-3 text-sm">{[['Name',user.name],['Email',user.email],['Phone',user.phone],['Address',user.address||'—'],['Customer since',dt(user.joined)],['Status',<Badge s={user.status}/>]].map(([k,v])=><div key={k} className="flex justify-between border-b border-slate-100 pb-2 dark:border-slate-800"><dt className="text-slate-500">{k}</dt><dd className="font-medium">{v}</dd></div>)}</dl><Btn className="mt-4" onClick={()=>{setF({name:user.name,phone:user.phone,address:user.address});setEdit(true)}}>Edit profile</Btn></>}</Card></>}

/* ---------- Admin ---------- */
const Stat=({l,v,s})=><Card><div className="text-sm text-slate-500">{l}</div><div className="mt-1 text-2xl font-bold text-navy-700 dark:text-blue-300">{v}</div>{s&&<div className="text-xs text-slate-500">{s}</div>}</Card>;
function AOverview(){
 const {db,svc}=useApp();useEffect(()=>{svc.refreshAdmin&&svc.refreshAdmin()},[]);const cust=db.users.filter(u=>u.role==='customer'&&(!USE_BACKEND||u.customerId));const vol=db.txns.filter(t=>t.status==='completed').reduce((s,t)=>s+t.amount,0);
 const byType=['deposit','withdrawal','transfer'].map(k=>({name:typeLabel[k],value:db.txns.filter(t=>t.type===k).length}));const COL=['#2d5fb8','#f59e0b','#10b981'];
 return <><Title t="Admin Overview" sub="Platform summary (simulated data)"/><div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><Stat l="Customers" v={cust.length} s={cust.filter(u=>u.status==='active').length+' active'}/><Stat l="Accounts" v={db.accounts.length} s={fmt(db.accounts.reduce((s,a)=>s+a.balance,0))+' held'}/><Stat l="Transactions" v={db.txns.length} s={db.txns.filter(t=>t.status==='failed').length+' failed'}/><Stat l="Completed volume" v={fmt(vol)}/></div>
  <div className="mt-4 grid gap-4 lg:grid-cols-2"><Card><h2 className="mb-2 font-semibold">Transactions by type</h2><div className="h-56"><RC.ResponsiveContainer><RC.PieChart><RC.Pie data={byType} dataKey="value" nameKey="name" outerRadius={80} label>{byType.map((_,i)=><RC.Cell key={i} fill={COL[i]}/>)}</RC.Pie><RC.Tooltip/><RC.Legend/></RC.PieChart></RC.ResponsiveContainer></div></Card><Card><h2 className="mb-2 font-semibold">Latest audit events</h2>{db.audit.slice(0,6).map(a=><div key={a.id} className="border-b border-slate-100 py-2 text-sm last:border-0 dark:border-slate-800"><b>{a.action}</b> · {a.actor}<div className="text-xs text-slate-500">{dt(a.date)} — {a.detail}</div></div>)}</Card></div></>}
function ACustomers(){
 const {db,svc,user,toast}=useApp();useEffect(()=>{svc.refreshAdmin&&svc.refreshAdmin()},[]);const [q,setQ]=useState('');const list=db.users.filter(u=>u.role==='customer'&&(!USE_BACKEND||u.customerId)&&(u.name+u.email+u.phone).toLowerCase().includes(q.toLowerCase()));
 const flip=async u=>{const s=u.status==='active'?'suspended':'active';await svc.setStatus(user,'user',u.id,s);toast(`${u.name} is now ${s}`)};
 return <><Title t="Customers" sub={`${list.length} customer(s)`}/><Card><input className={inp+' mb-4 max-w-sm'} placeholder="Search name, email, phone…" value={q} onChange={e=>setQ(e.target.value)}/><Table cols={['Name','Email','Phone','Accounts','Joined','Status','Action']} rows={list.map(u=>[u.name,u.email,u.phone,db.accounts.filter(a=>a.userId===u.id).length,dt(u.joined),<Badge s={u.status}/>,<Btn v="out" className="!py-1 !text-xs" onClick={()=>flip(u)}>{u.status==='active'?'Suspend':'Reactivate'}</Btn>])}/></Card></>}
function AAccounts(){
 const {db,svc,user,toast}=useApp();useEffect(()=>{svc.refreshAdmin&&svc.refreshAdmin()},[]);const [q,setQ]=useState('');const [st,setSt]=useState('');const list=db.accounts.filter(a=>(a.no+a.nick+(db.users.find(u=>u.id===a.userId)?.name||'')).toLowerCase().includes(q.toLowerCase())&&(!st||a.status===st));
 const flip=async a=>{const s=a.status==='active'?'frozen':'active';await svc.setStatus(user,'account',a.id,s);toast(`${a.no} is now ${s}`)};
 return <><Title t="Account Monitoring"/><Card><div className="mb-4 flex flex-wrap gap-2"><input className={inp+' max-w-xs'} placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)}/><select className={inp+' max-w-[10rem]'} value={st} onChange={e=>setSt(e.target.value)}><option value="">All</option><option>active</option><option>frozen</option></select></div><Table cols={['Account no.','Owner','Type','Balance','Status','Action']} rows={list.map(a=>[a.no,db.users.find(u=>u.id===a.userId)?.name,a.type,fmt(a.balance),<Badge s={a.status}/>,<Btn v="out" className="!py-1 !text-xs" onClick={()=>flip(a)}>{a.status==='active'?'Freeze':'Unfreeze'}</Btn>])}/></Card></>}
function ATxns(){
 const {db,svc}=useApp();useEffect(()=>{svc.refreshAdmin&&svc.refreshAdmin()},[]);const {out,props}=useFilter(db.txns,db);const [sel,setSel]=useState(null);
 return <><Title t="Transaction Monitoring" sub={`${out.length} transaction(s)`}/><Card><Filters {...props}/><Table cols={['Date','Ref','Type','From','To','Amount','Status']} onRow={i=>setSel(out[i])} rows={out.slice(0,100).map(t=>[dt(t.date),t.id,typeLabel[t.type],t.from?acctName(db,t.from):'—',t.to?acctName(db,t.to):'—',fmt(t.amount),<Badge s={t.status}/>])}/></Card>{sel&&<TxDetail t={sel} onClose={()=>setSel(null)}/>}</>}
function AAudit(){const {db,svc}=useApp();useEffect(()=>{svc.refreshAdmin&&svc.refreshAdmin()},[]);return <><Title t="Audit Logs" sub={USE_BACKEND?"Recorded by the backend (latest 100)":"Actions recorded during this demo session"}/><Card><Table cols={['Time','Actor','Action','Detail']} rows={db.audit.slice(0,150).map(a=>[dt(a.date),a.actor,<span className="font-mono text-xs">{a.action}</span>,a.detail])}/></Card></>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
