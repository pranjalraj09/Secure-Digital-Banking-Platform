/* ---------- seed (all fictional) ---------- */
const seed=()=>{
 const users=[
  {id:'u1',name:'John Snow',email:'demo@fincore.test',password:'Demo@1234',phone:'9876543210',address:'12 Lake View Road, Chennai',role:'customer',status:'active',joined:dAgo(400)},
  {id:'u2',name:'Arya Stark',email:'arya@fincore.test',password:'Demo@1234',phone:'9988776655',address:'8 Park Street, Kolkata',role:'customer',status:'active',joined:dAgo(120)},
  {id:'a1',name:'Admin Officer',email:'admin@fincore.test',password:'Admin@1234',phone:'9000000000',address:'FinCore HQ',role:'admin',status:'active',joined:dAgo(900)}];
 const accounts=[
  {id:'a-1',no:'FCN1001234501',userId:'u1',type:'Savings',nick:'Primary Savings',balance:84250.5,status:'active',opened:dAgo(390)},
  {id:'a-2',no:'FCN1001234502',userId:'u1',type:'Current',nick:'Spending',balance:23100,status:'active',opened:dAgo(200)},
  {id:'a-4',no:'FCN3003456701',userId:'u2',type:'Savings',nick:'Savings',balance:47890,status:'active',opened:dAgo(110)}];
 const txns=[];const T=(d,type,amt,desc,from,to,status='completed')=>txns.push({id:uid('TXN'),date:dAgo(d),type,amount:amt,desc,from,to,status,note:''});
 for(let m=0;m<6;m++){const b=m*30;
  T(b+2,'deposit',55000+m*1500,'Salary credit (demo)',null,'a-1');
  T(b+4,'withdrawal',18000,'Rent payment',  'a-1',null);
  T(b+7,'withdrawal',5200+m*300,'Groceries','a-2',null);
  T(b+9,'withdrawal',2400,'Utilities','a-2',null);
  T(b+12,'transfer',4000+m*500,'Transfer to Arjun','a-1','a-3');
  T(b+16,'withdrawal',3100,'Shopping','a-2',null);
  if(m%2)T(b+20,'deposit',6000,'Freelance payment (demo)',null,'a-2');}
 T(5,'withdrawal',90000,'ATM withdrawal (declined)','a-2',null,'failed');
 txns.sort((a,b)=>b.date.localeCompare(a.date));
 const audit=[{id:uid('AUD'),date:dAgo(2),actor:'Admin Officer',action:'ACCOUNT_REVIEW',detail:'Routine review of dormant accounts'},{id:uid('AUD'),date:dAgo(1),actor:'Priya Sharma',action:'LOGIN',detail:'Customer sign-in'}];
 return {users,accounts,txns,audit};};

/* ---------- BACKEND CONNECTION (added) — start ---------- */
const USE_BACKEND=true;                 // set to false to go back to the original fake demo (no backend needed)
const API_URL='http://localhost:8080';
let TOKEN=null,ROLE=null;
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s));
const items=p=>Array.isArray(p)?p:(p&&p.content)||[];

// one helper that talks to the backend
async function api(path,method='GET',body){
 let res;
 try{res=await fetch(API_URL+path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined})}
 catch(e){throw Error('Cannot reach the backend at '+API_URL+'. Is it running?')}
 const data=await res.json().catch(()=>null);
 if(!res.ok){
  let msg=(data&&(data.message||data.error))||'';
  if(data&&data.details)msg+=(msg?' — ':'')+Object.values(data.details).join(', ');
  if(!msg)msg=res.status===401?'Session expired. Please sign in again.':res.status===403?'You are not allowed to do this.':'Request failed ('+res.status+')';
  throw Error(msg)}
 return data}

// TEMPORARY dev login: the backend hands out a pass (token). Replace with Keycloak later.
async function getToken(username,role,customerId){
 TOKEN=null;ROLE=null;
 const q=new URLSearchParams({username,role});if(customerId)q.set('customerId',customerId);
 const d=await api('/api/auth/token?'+q.toString(),'POST');
 TOKEN=d.token;ROLE=role}

// some actions are staff-only in the backend (e.g. opening an account); borrow a teller pass, then give the user's pass back
async function asStaff(fn){const k=[TOKEN,ROLE];await getToken('teller@fincore.bank','TELLER');try{return await fn()}finally{TOKEN=k[0];ROLE=k[1]}}

// backend -> website shapes
const toAcct=(r,userId,old)=>({id:r.id,no:r.accountNumber,userId,type:r.accountType==='CHECKING'?'Current':'Savings',
 nick:(old&&old.nick)||(r.accountType==='CHECKING'?'Current Account':'Savings Account'),
 balance:Number(r.balance),status:String(r.status||'ACTIVE').toLowerCase(),opened:r.createdAt});
const toTxn=r=>{const w=String(r.transactionType).toUpperCase()==='WITHDRAWAL';const st=String(r.status).toUpperCase();
 const status=st==='COMPLETED'?'completed':(st==='FAILED'||st==='REJECTED')?'failed':'pending';
 return {id:r.id,date:r.timestamp,type:w?'withdrawal':'deposit',amount:Number(r.amount),
  desc:(r.description||(w?'Cash withdrawal':'Cash deposit'))+(status==='failed'&&r.failureReason?' — '+r.failureReason:''),
  from:w?r.accountId:null,to:w?null:r.accountId,status,note:''}};
function upsertAcct(db,a){const i=db.accounts.findIndex(x=>x.id===a.id);if(i>=0)db.accounts[i]=a;else db.accounts.push(a)}
function setTxns(db,accId,list){db.txns=db.txns.filter(t=>t.from!==accId&&t.to!==accId).concat(list);db.txns.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
// remove the original made-up accounts/transactions (their ids are not real backend ids)
function dropFake(db){const f=new Set(db.accounts.filter(a=>!isUuid(a.id)).map(a=>a.id));db.accounts=db.accounts.filter(a=>!f.has(a.id));db.txns=db.txns.filter(t=>!f.has(t.from)&&!f.has(t.to))}

// make sure this website user exists as a real customer in the backend, then switch to their own pass
async function linkBackend(u){
 if(u.role==='admin'){await getToken('admin@fincore.bank','ADMIN');return}
 await getToken('teller@fincore.bank','TELLER');
 let c=items(await api('/api/customers?size=200')).find(x=>String(x.email).toLowerCase()===u.email.toLowerCase());
 if(!c){const p=u.name.trim().split(/\s+/);
  c=await api('/api/customers','POST',{firstName:p[0],lastName:p.slice(1).join(' ')||'-',email:u.email,phoneNumber:u.phone||'0000000000'})}
 u.customerId=c.id;
 await getToken(u.email,'CUSTOMER',c.id)}

// load this customer's accounts + transactions
async function loadMine(db,u){
 for(const r of items(await api('/api/customers/'+u.customerId+'/accounts'))){
  upsertAcct(db,toAcct(r,u.id,db.accounts.find(x=>x.id===r.id)));
  setTxns(db,r.id,items(await api('/api/accounts/'+r.id+'/transactions?size=200')).map(toTxn))}}

// load everything an admin screen needs
async function refreshAdminData(db){
 const byCust={};
 for(const c of items(await api('/api/customers?size=200'))){
  let u=db.users.find(x=>x.customerId===c.id||String(x.email).toLowerCase()===String(c.email).toLowerCase());
  if(!u){u={id:'c-'+c.id,name:c.fullName||(c.firstName+' '+c.lastName),email:c.email,password:null,phone:c.phoneNumber||'',
   address:[c.addressLine1,c.city].filter(Boolean).join(', '),role:'customer',status:'active',joined:c.createdAt};db.users.push(u)}
  u.customerId=c.id;byCust[c.id]=u}
 const accs=items(await api('/api/accounts?size=200'));
 for(const r of accs){const u=byCust[r.customerId];upsertAcct(db,toAcct(r,u?u.id:null,db.accounts.find(x=>x.id===r.id)))}
 for(const r of accs.slice(0,30))setTxns(db,r.id,items(await api('/api/accounts/'+r.id+'/transactions?size=100')).map(toTxn));
 db.audit=items(await api('/api/audit-logs?size=100')).map(a=>({id:a.id,date:a.timestamp,actor:a.actor,action:a.action,detail:[a.resourceType,a.outcome].filter(Boolean).join(' · ')}))}

// the real versions of the website actions (they replace the fake ones)
function makeBackendSvc({db,commit,fake}){
 const money=async(u,id,amt,note,kind)=>{
  const a=db.accounts.find(x=>x.id===id);if(!a)throw Error('Account not found.');
  const r=await api('/api/accounts/'+id+'/transactions/'+kind,'POST',{amount:amt,description:note||(kind==='deposit'?'Cash deposit':'Cash withdrawal'),referenceId:'WEB-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)});
  a.balance=Number(r.resultingBalance);
  const t={id:r.id,date:r.timestamp,type:kind==='deposit'?'deposit':'withdrawal',amount:Number(r.amount),desc:r.description||(kind==='deposit'?'Cash deposit':'Cash withdrawal'),
   from:kind==='deposit'?null:id,to:kind==='deposit'?id:null,status:'completed',note};
  db.txns.unshift(t);commit();return t};
 return {
  async login(email,pw,portal){const u=await fake.login(email,pw,portal);   // password check is still local until Keycloak
   await linkBackend(u);dropFake(db);
   if(u.role==='admin')await refreshAdminData(db);else await loadMine(db,u);
   commit();return u},
  async register(f){const u=await fake.register(f);await linkBackend(u);dropFake(db);commit();return u},
  async openAccount(u,type,nick){
   if(db.accounts.filter(a=>a.userId===u.id).length>=5)throw Error('Maximum of 5 accounts reached.');
   const r=await asStaff(()=>api('/api/accounts','POST',{customerId:u.customerId,accountType:type==='Current'?'CHECKING':'SAVINGS',currency:'INR',initialBalance:0}));
   const a=toAcct(r,u.id,{nick:nick||type+' Account'});upsertAcct(db,a);commit();return a},
  deposit:(u,id,amt,note)=>money(u,id,amt,note,'deposit'),
  withdraw:(u,id,amt,note)=>money(u,id,amt,note,'withdraw'),
  async transfer(){throw Error('Transfer is not available yet: the backend transfer API is still being built.')},
  async setStatus(admin,kind,id,status){
   if(kind==='account'&&isUuid(id)){
    await api('/api/accounts/'+id+'/status','PATCH',{status:status==='frozen'?'FROZEN':'ACTIVE',reason:'Changed from admin console'});
    const a=db.accounts.find(x=>x.id===id);if(a)a.status=status;commit();return}
   return fake.setStatus(admin,kind,id,status)},          // customer suspend/reactivate is still local only
  async refreshAdmin(){if(ROLE!=='ADMIN')return;try{await refreshAdminData(db);commit()}catch(e){console.warn('Admin refresh failed:',e.message)}}
 }}
/* ---------- BACKEND CONNECTION (added) — end ---------- */

const Ctx=createContext();const useApp=()=>useContext(Ctx);

/* ---------- UI primitives ---------- */
const Btn=({v='pri',className,busy,children,...p})=><button {...p} disabled={p.disabled||busy} className={cx('inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed',v==='pri'&&'bg-navy-700 text-white hover:bg-navy-600 dark:bg-navy-500 dark:hover:bg-navy-600',v==='out'&&'border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800',v==='dng'&&'bg-red-600 text-white hover:bg-red-700',v==='gho'&&'hover:bg-slate-100 dark:hover:bg-slate-800',className)}>{busy&&<span className="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"/>}{children}</button>;
const Card=({className,children})=><div className={cx('rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700/60 dark:bg-navy-900',className)}>{children}</div>;
const inp='w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-500 dark:border-slate-600 dark:bg-navy-950';
const Field=({label,error,children})=><label className="block text-sm"><span className="mb-1 block font-medium text-slate-600 dark:text-slate-300">{label}</span>{children}{error&&<span className="mt-1 block text-xs text-red-600 dark:text-red-400">{error}</span>}</label>;
const Badge=({s})=>{const m={active:'green',completed:'green',failed:'red',frozen:'amber',suspended:'red',pending:'amber'}[s]||'slate';const c={green:'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300',red:'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300',amber:'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300',slate:'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-200'}[m];return <span className={cx('rounded-full px-2 py-0.5 text-xs font-medium capitalize',c)}>{s}</span>};
const Modal=({title,onClose,children})=><div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={onClose}><div className="max-h-[90vh] w-full max-w-md overflow-auto rounded-xl bg-white p-6 shadow-xl dark:bg-navy-900" onClick={e=>e.stopPropagation()}><div className="mb-4 flex items-center justify-between"><h3 className="text-lg font-semibold">{title}</h3><button onClick={onClose} aria-label="Close"><Ic n="x"/></button></div>{children}</div></div>;
const Title=({t,sub,children})=><div className="mb-5 flex flex-wrap items-end justify-between gap-3"><div><h1 className="text-2xl font-semibold text-navy-800 dark:text-white">{t}</h1>{sub&&<p className="text-sm text-slate-500 dark:text-slate-400">{sub}</p>}</div>{children}</div>;
const Table=({cols,rows,onRow,empty='No records found.'})=><div className="overflow-x-auto"><table className="w-full text-left text-sm"><thead><tr className="border-b border-slate-200 text-xs uppercase text-slate-500 dark:border-slate-700">{cols.map(c=><th key={c} className="whitespace-nowrap px-3 py-2 font-medium">{c}</th>)}</tr></thead><tbody>{rows.length?rows.map((r,i)=><tr key={i} onClick={onRow?()=>onRow(i):undefined} className={cx('border-b border-slate-100 dark:border-slate-800',onRow&&'cursor-pointer hover:bg-slate-50 dark:hover:bg-navy-800')}>{r.map((c,j)=><td key={j} className="whitespace-nowrap px-3 py-2.5">{c}</td>)}</tr>):<tr><td colSpan={cols.length} className="px-3 py-8 text-center text-slate-500">{empty}</td></tr>}</tbody></table></div>;

/* ---------- helpers ---------- */
const signed=(t,ids)=>(ids.has(t.to)?t.amount:0)-(ids.has(t.from)?t.amount:0);
const acctName=(db,id)=>{const a=db.accounts.find(x=>x.id===id);return a?`${a.nick||a.type} ••${a.no.slice(-4)}`:'External'};
const typeLabel={deposit:'Deposit',withdrawal:'Withdrawal',transfer:'Transfer'};
const SimBanner=()=><div className="bg-amber-400 px-3 py-1.5 text-center text-xs font-semibold text-navy-950">{USE_BACKEND?'LIVE BACKEND · DEV MODE · test data only':'SIMULATION ONLY'}</div>;

/* ---------- App ---------- */
function App(){
 const dbRef=useRef(seed());const [,tick]=useState(0);const db=dbRef.current;const commit=()=>tick(n=>n+1);
 const [user,setUser]=useState(null);const [page,setPage]=useState('');const [toasts,setToasts]=useState([]);
 const [dark,setDark]=useState(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 useEffect(()=>{document.documentElement.classList.toggle('dark',dark)},[dark]);
 const toast=(msg,kind='ok')=>{const id=Math.random();setToasts(t=>[...t,{id,msg,kind}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000)};
 const log=(actor,action,detail)=>db.audit.unshift({id:uid('AUD'),date:new Date().toISOString(),actor:actor.name,action,detail});
 const cur=user&&db.users.find(u=>u.id===user.id);
 const fake={
  async login(email,pw,portal){await delay(700);const u=db.users.find(u=>u.email===email.trim().toLowerCase()&&u.password===pw);if(!u)throw Error('Invalid email or password.');if(u.role!==portal)throw Error(portal==='admin'?'This account does not have admin access.':'Admins must use the Admin portal.');if(u.status!=='active')throw Error('This profile is suspended. Contact support.');log(u,'LOGIN',portal+' sign-in');commit();return u},
  async register(f){await delay(800);if(db.users.some(u=>u.email===f.email.toLowerCase()))throw Error('An account with this email already exists.');const u={id:uid('u'),name:f.name,email:f.email.toLowerCase(),password:f.password,phone:f.phone,address:'',role:'customer',status:'active',joined:new Date().toISOString()};db.users.push(u);log(u,'REGISTER','New customer registered');commit();return u},
  async openAccount(u,type,nick){await delay(700);if(db.accounts.filter(a=>a.userId===u.id).length>=5)throw Error('Maximum of 5 accounts reached.');const a={id:uid('a'),no:'FCN'+Math.floor(1e9+Math.random()*9e9)+'',userId:u.id,type,nick:nick||type+' Account',balance:0,status:'active',opened:new Date().toISOString()};db.accounts.push(a);log(u,'ACCOUNT_OPEN',`${type} ${a.no}`);commit();return a},
  async deposit(u,id,amt,note){await delay(900);const a=db.accounts.find(x=>x.id===id);if(!a||a.userId!==u.id)throw Error('Account not found.');if(a.status!=='active')throw Error('Account is not active.');if(!(amt>0))throw Error('Amount must be positive.');if(amt>500000)throw Error('Demo deposit limit is ₹5,00,000.');a.balance=+(a.balance+amt).toFixed(2);const t={id:uid('TXN'),date:new Date().toISOString(),type:'deposit',amount:amt,desc:note||'Cash deposit (simulated)',from:null,to:id,status:'completed',note};db.txns.unshift(t);log(u,'DEPOSIT',`${fmt(amt)} → ${a.no}`);commit();return t},
  async withdraw(u,id,amt,note){await delay(900);const a=db.accounts.find(x=>x.id===id);if(!a||a.userId!==u.id)throw Error('Account not found.');if(a.status!=='active')throw Error('Account is not active.');if(!(amt>0))throw Error('Amount must be positive.');if(amt>a.balance)throw Error('Insufficient balance for this withdrawal.');a.balance=+(a.balance-amt).toFixed(2);const t={id:uid('TXN'),date:new Date().toISOString(),type:'withdrawal',amount:amt,desc:note||'Cash withdrawal (simulated)',from:id,to:null,status:'completed',note};db.txns.unshift(t);log(u,'WITHDRAW',`${fmt(amt)} ← ${a.no}`);commit();return t},
  async transfer(u,fromId,toNo,amt,note){await delay(1000);const f=db.accounts.find(x=>x.id===fromId);const t=db.accounts.find(x=>x.no===toNo.trim().toUpperCase());if(!f||f.userId!==u.id)throw Error('Sender account not found.');if(!t)throw Error('Recipient account number not found.');if(t.id===f.id)throw Error('Cannot transfer to the same account.');if(f.status!=='active'||t.status!=='active')throw Error('Both accounts must be active.');if(!(amt>0))throw Error('Amount must be positive.');if(amt>f.balance)throw Error('Insufficient balance for this transfer.');f.balance=+(f.balance-amt).toFixed(2);t.balance=+(t.balance+amt).toFixed(2);const x={id:uid('TXN'),date:new Date().toISOString(),type:'transfer',amount:amt,desc:note||'Transfer',from:f.id,to:t.id,status:'completed',note};db.txns.unshift(x);log(u,'TRANSFER',`${fmt(amt)} ${f.no} → ${t.no}`);commit();return x},
  async updateProfile(u,f){await delay(600);Object.assign(db.users.find(x=>x.id===u.id),f);log(u,'PROFILE_UPDATE','Profile edited');commit()},
  async setStatus(admin,kind,id,status){await delay(400);const o=(kind==='user'?db.users:db.accounts).find(x=>x.id===id);o.status=status;log(admin,kind.toUpperCase()+'_'+status.toUpperCase(),o.name||o.no);commit()}};

 const [confirm,setConfirm]=useState(false);const [busy,setBusy]=useState(false);const [res,setRes]=useState(null);
 const f=accts.find(a=>a.id===from);const rec=db.accounts.find(a=>a.no===to.trim().toUpperCase());const recUser=rec&&db.users.find(u=>u.id===rec.userId);const n=parseFloat(amt);
 const check=()=>{const e={};if(!f)e.from='Select a sender account.';if(!to.trim())e.to='Enter or pick a recipient account number.';else if(!rec)e.to='No FinCore account found with that number.';else if(rec.id===from)e.to='Cannot transfer to the same account.';else if(rec.status!=='active')e.to='Recipient account is not active.';
  if(!amt||isNaN(n)||n<=0)e.amt='Enter an amount greater than zero.';else if(!/^\d+(\.\d{1,2})?$/.test(amt))e.amt='Use at most 2 decimal places.';else if(f&&n>f.balance)e.amt='Insufficient balance. Available: '+fmt(f.balance);else if(f&&f.status!=='active')e.from='Sender account is not active.';
  setErr(e);if(!Object.keys(e).length)setConfirm(true)};
 const run=async()=>{setBusy(true);try{const t=await svc.transfer(user,from,to,n,note.trim());setRes({ok:true,t});setAmt('');setNote('');setTo('');toast('Transfer successful')}catch(e){setRes({ok:false,msg:e.message});toast(e.message,'err')}setBusy(false);setConfirm(false)};
 const others=accts.filter(a=>a.id!==from);
 return <><Title t="Money Transfer" sub="Move money between FinCore accounts (simulated)"/>

   {rec&&recUser&&<p className="text-xs text-emerald-600">Recipient: {recUser.name} ({rec.type})</p>}
   <Field label="Amount (₹)" error={err.amt}><input className={inp} inputMode="decimal" placeholder="0.00" value={amt} onChange={e=>setAmt(e.target.value)}/></Field>

function Filters({q,setQ,from,setFrom,to,setTo,st,setSt,ty,setTy}){return <div className="mb-4 grid gap-2 sm:grid-cols-2 lg:grid-cols-5"><div className="relative lg:col-span-1"><span className="absolute left-2.5 top-2.5 text-slate-400"><Ic n="search"/></span><input className={inp+' pl-8'} placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)}/></div><input type="date" className={inp} value={from} onChange={e=>setFrom(e.target.value)} aria-label="From date"/><input type="date" className={inp} value={to} onChange={e=>setTo(e.target.value)} aria-label="To date"/><select className={inp} value={st} onChange={e=>setSt(e.target.value)}><option value="">All statuses</option><option>completed</option><option>failed</option><option>pending</option></select><select className={inp} value={ty} onChange={e=>setTy(e.target.value)}><option value="">All types</option><option value="deposit">Deposit</option><option value="withdrawal">Withdrawal</option><option value="transfer">Transfer</option></select></div>}
const useFilter=(list,db)=>{const [q,setQ]=useState('');const [from,setFrom]=useState('');const [to,setTo]=useState('');const [st,setSt]=useState('');const [ty,setTy]=useState('');
 const out=list.filter(t=>(!q||(t.desc+t.id+acctName(db,t.from)+acctName(db,t.to)).toLowerCase().includes(q.toLowerCase()))&&(!from||t.date.slice(0,10)>=from)&&(!to||t.date.slice(0,10)<=to)&&(!st||t.status===st)&&(!ty||t.type===ty));
 return {out,props:{q,setQ,from,setFrom,to,setTo,st,setSt,ty,setTy}}};
function History(){
 const {db}=useApp();const {ids,txns}=useMine();const {out,props}=useFilter(txns,db);const [sel,setSel]=useState(null);
 return <><Title t="Transaction History" sub={`${out.length} transaction(s)`}/><Card><Filters {...props}/>{out.map(t=><TxItem key={t.id} t={t} ids={ids} onClick={()=>setSel(t)}/>)}{!out.length&&<p className="py-8 text-center text-sm text-slate-500">No transactions match your filters.</p>}</Card>{sel&&<TxDetail t={sel} onClose={()=>setSel(null)}/>}</>}

/* ---------- Statements ---------- */
function Statements() {
  const { toast } = useApp();
  const { accts, txns } = useMine();

  const [acct, setAcct] = useState('all');
  const [from, setFrom] = useState(
    new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10)
  );
  const [to, setTo] = useState(
    new Date().toISOString().slice(0, 10)
  );

  const err = from > to
    ? 'Start date must be before end date.'
    : '';

  const rows = err
    ? []
    : txns
        .filter(
          t =>
            t.status === 'completed' &&
            t.date.slice(0, 10) >= from &&
            t.date.slice(0, 10) <= to &&
            (acct === 'all' || t.from === acct || t.to === acct)
        )
        .sort((a, b) => a.date.localeCompare(b.date));

  const sgn = t =>
    acct === 'all'
      ? signed(t, new Set(accts.map(a => a.id)))
      : signed(t, new Set([acct]));

  // Download statement as CSV
  const download = () => {
    if (err) {
      toast(err, 'err');
      return;
    }

    if (!rows.length) {
      toast('No transactions available to export.', 'err');
      return;
    }

    const q = v =>
      '"' + String(v ?? '').replace(/"/g, '""') + '"';

    const csv = [
      'Date,Reference,Type,Description,Credit,Debit,Status (SIMULATED DATA)',

      ...rows.map(t => {
        const s = sgn(t);

        return [
          q(dt(t.date)),
          q(t.id),
          q(t.type),
          q(t.desc),
          s > 0 ? s.toFixed(2) : '',
          s < 0 ? (-s).toFixed(2) : '',
          q(t.status)
        ].join(',');
      })
    ].join('\r\n');

    const blob = new Blob(
      ['\uFEFF' + csv],
      { type: 'text/csv;charset=utf-8;' }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download =
      `fincore-statement-${from}_to_${to}.csv`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    toast('Statement downloaded successfully!');
  };

  // Statements page UI
  return (
    <>
      <Title
        t="Statements"
        sub="Select a range and export as CSV"
      />

      <Card>
        <div className="grid gap-3 sm:grid-cols-4">

          <Field label="Account">
            <select
              className={inp}
              value={acct}
              onChange={e => setAcct(e.target.value)}
            >
              <option value="all">All accounts</option>

              {accts.map(a => (
                <option key={a.id} value={a.id}>
                  {a.nick} ••{a.no.slice(-4)}
                </option>
              ))}
            </select>
          </Field>

          <Field label="From" error={err}>
            <input
              type="date"
              className={inp}
              value={from}
              onChange={e => setFrom(e.target.value)}
            />
          </Field>

          <Field label="To">
            <input
              type="date"
              className={inp}
              value={to}
              onChange={e => setTo(e.target.value)}
            />
          </Field>

          <div className="flex items-end">
            <Btn
              className="w-full"
              disabled={!rows.length || !!err}
              onClick={download}
            >
              <Ic n="dl" />
              Download CSV
            </Btn>
          </div>

        </div>

        <div className="mt-4">
          <Table
            cols={[
              'Date',
              'Reference',
              'Description',
              'Credit',
              'Debit'
            ]}
            empty="No completed transactions in this range."
            rows={rows.map(t => {
              const s = sgn(t);

              return [
                dt(t.date),
                t.id,
                t.desc,
                s > 0 ? fmt(s) : '',
                s < 0 ? fmt(-s) : ''
              ];
            })}
          />
        </div>
      </Card>
    </>
  );
}
